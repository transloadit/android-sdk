name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - unlabeled

jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gradle (Java 17)
            java: '17'
            run-script: false
          - name: Docker Harness (Java 21)
            java: '21'
            run-script: true
    env:
      TRANSLOADIT_KEY: ${{ secrets.TRANSLOADIT_KEY }}
      TRANSLOADIT_SECRET: ${{ secrets.TRANSLOADIT_SECRET }}
      ANDROID_SDK_E2E: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        if: ${{ matrix.run-script == false }}
        run: ./gradlew assemble
      - name: Run Tests
        if: ${{ matrix.run-script == false }}
        run: ./gradlew check
      - name: Run Dockerized Check
        if: ${{ matrix.run-script == true }}
        run: ./scripts/test-in-docker.sh check

  slack-on-failure:
    needs: [android]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TEXT: >-
            ${{ github.workflow }} failed for ${{ github.repository }} on ${{ github.ref_name }}:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "process.stdout.write(JSON.stringify({ text: process.env.SLACK_TEXT }))" |
            curl --fail-with-body -X POST -H 'Content-type: application/json' --data-binary @- "$SLACK_WEBHOOK_URL"
